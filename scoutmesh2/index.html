<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chirp — Search</title>
<style>
  :root{
    --bg:#f0f2f5;
    --panel:#ffffff;
    --line:#e1e4e8;
    --text:#0f1419;
    --text-dim:#5b6470;
    --brand:#3b9dd6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    font-family:-apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:48px 40px; width:100%; max-width:420px; text-align:center;
  }
  .brand-mark{
    width:52px; height:52px; border-radius:14px; background:var(--brand);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:26px;
    margin:0 auto 18px;
  }
  h1{font-size:20px; margin:0 0 6px;}
  .sub{color:var(--text-dim); font-size:14px; margin:0 0 28px;}

  form{display:flex; gap:8px;}
  input{
    flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
    font-size:14.5px; font-family:inherit;
  }
  input:focus{outline:2px solid var(--brand); outline-offset:-1px;}
  button{
    background:var(--brand); color:#fff; border:none; padding:12px 20px;
    border-radius:8px; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  button:hover{background:#2f88bd;}

  .error{color:#d64545; font-size:13.5px; margin-top:14px; min-height:18px;}
  .hint{color:var(--text-dim); font-size:12.5px; margin-top:24px;}
</style>
</head>
<body>

<div class="card">
  <div class="brand-mark">C</div>
  <h1>Search Chirp</h1>
  <p class="sub">Find people by their @handle</p>

  <form id="search-form">
    <input type="text" id="handle-input" placeholder="@handle" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div class="error" id="error-msg"></div>

  <div class="hint">Try searching for someone by their exact @handle.</div>
</div>

<script>
  // known public profiles on this mock platform
  const KNOWN_USERS = {
    "renishikawa_dev": "renishikawa_dev.html"
  };

  document.getElementById('search-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const raw = document.getElementById('handle-input').value.trim();
    const handle = raw.replace(/^@/, '').toLowerCase();
    const errorEl = document.getElementById('error-msg');

    if (KNOWN_USERS[handle]) {
      window.location.href = KNOWN_USERS[handle];
    } else {
      errorEl.textContent = 'No user found with that handle.';
    }
  });
</script>

</body>
</html>
