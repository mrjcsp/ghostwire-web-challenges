<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スカウトのクッキーコーナー 🍪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ffd1dc;
    --pink-dark:#ff8fab;
    --mint:#c7f9cc;
    --lavender:#e0bbff;
    --yellow:#fff3b0;
    --brown:#7a5230;
    --brown-dark:#5c3d22;
    --text:#4a3728;
    --card:#fffaf3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    background: linear-gradient(160deg, var(--pink) 0%, var(--lavender) 45%, var(--mint) 100%);
    background-attachment: fixed;
    font-family:'Quicksand', sans-serif;
    color: var(--text);
    min-height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; padding:50px 24px 90px;}

  header{text-align:center; margin-bottom:36px;}
  header h1{
    font-family:'Baloo 2', cursive; font-size:38px; color:var(--brown-dark);
    margin:0 0 8px; text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
  }
  header p{color:var(--brown); font-size:16px; margin:0; font-weight:600;}

  .card{
    background: var(--card);
    border-radius: 24px;
    padding: 30px 28px;
    box-shadow: 0 10px 30px rgba(122,82,48,0.15);
    margin-bottom: 24px;
  }

  .search-row{display:flex; gap:10px; margin-top:6px;}
  input[type="text"]{
    flex:1; padding:14px 18px; border-radius:16px; border:2px solid var(--pink-dark);
    font-family:'Quicksand', sans-serif; font-size:16px; font-weight:600; color:var(--text);
    outline:none;
  }
  input[type="text"]:focus{border-color: var(--brown);}
  button{
    background: var(--pink-dark); color:white; border:none; border-radius:16px;
    padding:14px 24px; font-family:'Baloo 2', cursive; font-weight:700; font-size:16px;
    cursor:pointer; transition: transform .15s, background .15s;
  }
  button:hover{background: var(--brown); transform: translateY(-2px);}

  .hint{font-size:13.5px; color:var(--brown); margin-top:12px; opacity:0.8;}
  .hint b{color:var(--brown-dark);}

  .result{
    margin-top:22px; padding:20px; border-radius:18px;
    background: var(--yellow); border: 2px dashed var(--pink-dark);
    font-size:17px; font-weight:600; min-height:28px;
    display:flex; align-items:center; gap:12px;
  }
  .result .emoji{font-size:28px;}

  .about{font-size:14.5px; color:var(--brown); line-height:1.6; text-align:center;}

  footer{text-align:center; font-size:12.5px; color:var(--brown); opacity:0.7; margin-top:30px;}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>🍪 スカウトのクッキーコーナー 🍪</h1>
    <p>とても大切なクッキー番付、スカウトより</p>
  </header>

  <div class="card">
    <div class="about">
      フィールドでたくさんのクッキーを試してきました。これは私の個人的なリストです。フレーバーを検索して、私の感想を見てみてください！
    </div>
    <div class="search-row">
      <input type="text" id="cookieSearch" placeholder="例: chocolate chip">
      <button onclick="searchCookie()">検索</button>
    </div>
    <div class="hint">スカウトのお気に入り: <b>sugar</b>、<b>chocolate chip</b>、<b>wink</b>、<b>wink</b>、🐾</div>
    <div class="result" id="result">
      <span class="emoji">🍪</span>
      <span id="resultText">クッキーを検索して、スカウトの感想を見てみよう！</span>
    </div>
  </div>

</div>

<footer>スカウトのクッキーコーナー・いつからか忘れちゃった</footer>

<script>
  // known searchable flavors -> cookie values
  const KNOWN_FLAVORS = {
    "sugar": 1,
    "chocolate chip": 3,
    "snickerdoodle": 5,
    "oatmeal raisin": 2,
    "peanut butter": 4
  };

  function setCookie(name, value) {
    document.cookie = name + "=" + value + "; path=/";
  }

  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
  }

  function renderFromCookie() {
    const val = getCookie("name");
    const resultText = document.getElementById("resultText");
    const resultBox = document.getElementById("result");
    const emojiSpan = resultBox.querySelector(".emoji");

    if (val === null || val === "-1") {
      emojiSpan.textContent = "🍪";
      resultText.textContent = "クッキーを検索して、スカウトの感想を見てみよう！";
      return;
    }

    // each flavor's data lives in its own file, only fetched once we
    // actually know which number the cookie is set to
    fetch("data/" + val + ".json")
      .then(function (r) {
        if (!r.ok) throw new Error("not found");
        return r.json();
      })
      .then(function (entry) {
        emojiSpan.textContent = entry.emoji;
        resultText.textContent = entry.text;
      })
      .catch(function () {
        emojiSpan.textContent = "❓";
        resultText.textContent = "うーん、スカウトのクッキーリストには無いみたい…";
      });
  }

  function searchCookie() {
    const input = document.getElementById("cookieSearch").value.trim().toLowerCase();
    if (KNOWN_FLAVORS.hasOwnProperty(input)) {
      setCookie("name", KNOWN_FLAVORS[input]);
    } else {
      setCookie("name", -1);
    }
    renderFromCookie();
  }

  // on page load, reflect whatever cookie already exists
  renderFromCookie();
</script>

</body>
</html>
